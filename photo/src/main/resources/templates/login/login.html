<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - TJphoto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* (기존 전용 스타일 코드와 동일하여 가독성을 위해 중략합니다) */
        .login-body { background-color: #f8f9fa; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); width: 100%; max-width: 420px; text-align: center; }
        .login-header h2 { font-size: 28px; color: #2c3e50; margin-bottom: 10px; font-weight: 700; }
        .login-header p { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; color: #555; margin-bottom: 8px; font-weight: 500; }
        .input-field { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.2s; outline: none; }
        .input-field:focus { border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1); }
        .login-options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #666; margin-bottom: 30px; }
        .login-options input[type="checkbox"] { margin-right: 5px; accent-color: #4a90e2; }
        .find-link { color: #7f8c8d; text-decoration: none; }
        .find-link:hover { color: #4a90e2; text-decoration: underline; }
        .btn-submit { width: 100%; padding: 14px; background-color: #4a90e2; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #357abd; }
        .signup-hint { margin-top: 25px; font-size: 14px; color: #7f8c8d; }
        .signup-hint a { color: #4a90e2; text-decoration: none; font-weight: 600; margin-left: 5px; }
        .signup-hint a:hover { text-decoration: underline; }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <h2 onclick="location.href='/'" style="cursor: pointer;">TJphoto</h2>
            <p>소중한 추억을 찾아 오신 것을 환영합니다.</p>
        </div>
    <form th:action="@{/login}" method="POST">
        
        <!-- 아이디 입력 상자 -->
        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" class="input-field" placeholder="아이디를 입력하세요" required>
        </div>
        
        <!-- 비밀번호 입력 상자 -->
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" class="input-field" placeholder="비밀번호를 입력하세요" required>
        </div>
        
        <button type="submit" class="submit-btn">로그인</button>
    </form>



        <div class="signup-hint">
            아직 회원이 아니신가요? <a th:href="@{/join}">회원가입 하기</a>
        </div>
    </div>

</body>
</html>
