<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - TJphoto</title>
    <!-- 공통 스타일시트 연결 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* 회원가입 페이지 전용 스타일 */
        .signup-body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .signup-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .signup-header h2 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .signup-header p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 입력 폼 스타일 */
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            outline: none;
        }

        .input-field:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        /* 약관 동의 체크박스 */
        .terms-group {
            text-align: left;
            font-size: 13px;
            color: #666;
            margin: 25px 0;
            background-color: #fdfdfd;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #f0f0f0;
        }

        .terms-group input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #4a90e2;
        }

        /* 가입 버튼 */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #357abd;
        }

        /* 로그인 이동 링크 */
        .login-hint {
            margin-top: 25px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .login-hint a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .login-hint a:hover {
            text-decoration: underline;
        }

        /* 실시간 비밀번호 일치 메시지용 스타일 */
        .msg-text {
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body class="signup-body">

    <div class="signup-card">
        <!-- 상단 타이틀 -->
        <div class="signup-header">
            <h2 onclick="location.href='/'" style="cursor: pointer;">TJphoto</h2>
            <p>새로운 계정을 만들고 소중한 사진들을 기록해 보세요.</p>
        </div>

        <!-- 회원가입 폼 -->
        <form action="/signup-process" method="POST" onsubmit="return validateForm()">
            <!-- 이름 입력 -->
            <div class="input-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" class="input-field" placeholder="홍길동" required>
            </div>

            <!-- 이메일(아이디) 입력 -->
            <div class="input-group">
                <label for="username">이메일 주소 (아이디)</label>
                <input type="email" id="username" name="username" class="input-field" placeholder="example@email.com" required>
            </div>

            <!-- 비밀번호 입력 -->
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="8자 이상 입력하세요" required oninput="checkPasswordMatch()">
            </div>

            <!-- 비밀번호 재확인 입력 -->
            <div class="input-group">
                <label for="confirm-password">비밀번호 확인</label>
                <input type="password" id="confirm-password" class="input-field" placeholder="비밀번호를 한번 더 입력하세요" required oninput="checkPasswordMatch()">
                <div id="password-msg" class="msg-text"></div>
            </div>

            <!-- 약관 동의 -->
            <div class="terms-group">
                <label>
                    <input type="checkbox" id="terms" required> 필수 서비스 이용약관 및 개인정보 처리방침에 동의합니다.
                </label>
            </div>

            <!-- 가입 버튼 -->
            <button type="submit" class="btn-submit">회원가입 완료</button>
        </form>

        <!-- 하단 로그인 링크 -->
        <div class="login-hint">
            이미 계정이 있으신가요? <a th:href="@{/login}">로그인 하기</a>
        </div>
    </div>

    <script>
        // 비밀번호 실시간 체크 스크립트
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const msgElement = document.getElementById('password-msg');
            
            if(!confirmPassword) {
                msgElement.style.display = 'none';
                return;
            }

            msgElement.style.display = 'block';
            if (password === confirmPassword) {
                msgElement.innerText = "✓ 비밀번호가 일치합니다.";
                msgElement.style.color = "#2ecc71";
            } else {
                msgElement.innerText = "✕ 비밀번호가 일치하지 않습니다.";
                msgElement.style.color = "#e74c3c";
            }
        }

        // 제출 시 최종 비밀번호 체크 검증
        function validateForm() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                alert('비밀번호가 일치하지 않습니다. 다시 확인해 주세요.');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
