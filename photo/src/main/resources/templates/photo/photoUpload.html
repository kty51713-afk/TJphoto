<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사진 업로드</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
</head>
<body>
    <header th:replace="~{layout/header :: header}"></header>

    <main>
        <div class="upload-box">
            <h1>사진 업로드</h1>
            <p>공유하고 싶은 사진을 선택하거나 이 상자 안으로 드래그해 주세요.</p>
            
            <form th:action="@{/photos/upload}" method="post" enctype="multipart/form-data" class="upload-form">
                
                <div id="dropZone" class="drop-zone">
                    <p>📸 여기로 사진을 드래그하거나 클릭하여 선택하세요.</p>
                    <input type="file" id="fileInput" name="files" accept="image/*" multiple required>
                    
                    <div id="fileListContainer" class="file-list-container" style="display: none;">
                        <div class="file-list-header">
                            <strong id="fileCountText">선택된 파일 (0개):</strong>
                            <span class="upload-tip">파일을 하나씩 드래그하여 목록에 추가할 수 있습니다.</span>
                        </div>
                        <ul id="fileList" class="file-list"></ul>
                    </div>
                </div>

                <button type="submit" class="submit-btn">업로드 하기</button>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout/footer :: footer}"></footer>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const fileList = document.getElementById('fileList');
        const fileCountText = document.getElementById('fileCountText');

        // [핵심 데이터 구조] 사용자가 올린 파일들을 누적해서 관리할 전역 배열
        let fileArray = [];

        // 1. 드래그 박스 영역 클릭 시 파일 탐색기 실행 (단, 리스트 내부 클릭 시에는 파일창 차단)
        dropZone.addEventListener('click', (e) => {
            if (!fileListContainer.contains(e.target)) {
                fileInput.click();
            }
        });

        // 2. 파일 탐색기에서 사진들을 새로 선택했을 때 (기존 리스트에 누적)
        fileInput.addEventListener('change', (e) => {
            addFilesToList(e.target.files);
            // 중요: value를 비워주어야 사용자가 동일한 이름의 파일을 연달아 취소 후 다시 올릴 때도 정상 감지함
            e.target.value = ''; 
        });

        // 3. 브라우저 기본 드래그 드롭 파일 열기 동작 방지
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        // 4. 드래그 스타일 활성화 / 비활성화
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // 5. 사진 파일을 드롭했을 때 (기존 리스트에 누적)
        dropZone.addEventListener('drop', (e) => {
            const droppedFiles = e.dataTransfer.files;
            addFilesToList(droppedFiles);
        }, false);

        // [함수] 받아온 파일들을 전역 배열에 누적하고 화면과 input 값을 동기화하는 로직
        function addFilesToList(files) {
            if (files.length === 0) return;

            // 파일 객체들을 순차적으로 배열에 push (이로 인해 하나씩 드래그해도 누적 추가됨)
            for (let i = 0; i < files.length; i++) {
                // 이미지 파일 확장자 검증 (선택 사항)
                if (files[i].type.startsWith('image/')) {
                    fileArray.push(files[i]);
                }
            }
            updateDisplayAndInput();
        }

        // [함수] 특정 인덱스의 파일을 배열에서 제외하는 취소(삭제) 로직
        function removeFileFromList(index) {
            fileArray.splice(index, 1); // 해당 위치의 파일 1개 제거
            updateDisplayAndInput();
        }

        // [함수] 가상 전역 배열(fileArray)을 바탕으로 화면 렌더링 및 실제 HTML input의 파일값 동기화
        function updateDisplayAndInput() {
            // 1. 화면 목록 비우기
            fileList.innerHTML = '';

            if (fileArray.length === 0) {
                fileListContainer.style.display = 'none';
                fileInput.required = true; // 파일이 하나도 없으면 전송 불가 설정
            } else {
                fileListContainer.style.display = 'block';
                fileInput.required = false; // 파일이 존재하면 input 자체의 required는 해제 (배열로 검증하므로)
                fileCountText.textContent = `선택된 파일 (${fileArray.length}개):`;

                // 누적된 모든 파일을 순회하며 구조 렌더링
                fileArray.forEach((file, index) => {
                    const li = document.createElement('li');
                    li.className = 'file-item';

                    // 파일 이름 표기 영역
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = `• ${file.name}`;
                    li.appendChild(nameSpan);

                    // 개별 취소 버튼 생성 (X)
                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button'; // 일반 버튼으로 선언하여 폼이 바로 서브밋되는 현상 방지
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = '✕';
                    
                    // 취소 버튼 클릭 이벤트
                    deleteBtn.addEventListener('click', (event) => {
                        event.stopPropagation(); // 부모 엘리먼트(dropZone)로 클릭 이벤트가 퍼져서 파일창이 다시 뜨는 버그 차단
                        removeFileFromList(index);
                    });
                    
                    li.appendChild(deleteBtn);
                    fileList.appendChild(li);
                });
            }

            // 2. [가장 중요] 브라우저 표준 DataTransfer를 사용하여 실제 자바 서버로 넘어갈 input 창 데이터 동기화
            const dataTransfer = new DataTransfer();
            fileArray.forEach(file => {
                dataTransfer.items.add(file);
            });
            fileInput.files = dataTransfer.files; // 실제 서버 전송 컨테이너에 누적본 주입
        }
    </script>
</body>
</html>
